name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_ZENDESK_KEY: ${{ secrets.VITE_ZENDESK_KEY }}
          VITE_SHARED_SECRET: ${{ secrets.VITE_SHARED_SECRET }}
          VITE_KEY_ID: ${{ secrets.VITE_KEY_ID }}
          VITE_SUNSHINE_APP_ID: ${{ secrets.VITE_SUNSHINE_APP_ID }}
          VITE_SUNSHINE_USERNAME: ${{ secrets.VITE_SUNSHINE_USERNAME }}
          VITE_SUNSHINE_PASSWORD: ${{ secrets.VITE_SUNSHINE_PASSWORD }}
          VITE_PRDW_TOKEN: ${{ secrets.VITE_PRDW_TOKEN }}
          VITE_WA_LINE_ID: ${{ secrets.VITE_WA_LINE_ID }}
          VITE_WA_TEMPLATE_ID: ${{ secrets.VITE_WA_TEMPLATE_ID }}
          VITE_WA_DESTINATION_ID: ${{ secrets.VITE_WA_DESTINATION_ID }}
          VITE_WA_USERNAME: ${{ secrets.VITE_WA_USERNAME }}
          VITE_RETURN_URL: ${{ secrets.VITE_RETURN_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
